[tools]
"cargo:cargo-bundle" = { version = "0.12.0", os = ["linux", "macos"] }
"dotnet:wix" = { version = "7.0.1", os = ["windows"], postinstall = "mise run setup-wix" }
"cargo:https://github.com/volks73/cargo-wix" = { version = "rev:9a8ed9486637e1fb839f209730eda6c95fd12d88", locked = true, os = ["windows"], crate = "cargo-wix", bin = "cargo-wix" }

[settings]
experimental = true

[tasks.setup-wix]
run = [
    "wix eula accept wix7",
    "wix extension add -g WixToolset.Util.wixext/{{ tools['dotnet:wix'].version | replace(from='[', to='') | replace(from=']', to='') }}",
    "wix extension add -g WixToolset.UI.wixext/{{ tools['dotnet:wix'].version | replace(from='[', to='') | replace(from=']', to='') }}",
]
